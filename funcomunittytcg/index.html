<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>funComunitty e-trading cards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

/* HEADER */

header {
    background: #1d1d1d;
    padding: 18px;
    text-align: center;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
}

nav {
    margin-top: 12px;
}

nav button {
    background: #333;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin: 4px;
}

nav button:hover {
    background: #444;
}

/* MAIN */

main {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* PACK */

.pack-area {
    text-align: center;
}

.pack {
    width: 210px;
    height: 290px;
    margin: 30px auto;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #6a00ff,
            #00aaff
        );

    box-shadow: 0 10px 35px #000;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 35px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.pack:hover {
    transform: scale(1.04);
}

.pack.disabled {
    opacity: .4;
    cursor: not-allowed;
}

.pack-opening {
    animation: shake .15s infinite alternate;
}

@keyframes shake {

    from {
        transform: rotate(-3deg) scale(1.03);
    }

    to {
        transform: rotate(3deg) scale(1.06);
    }

}

/* BUTTON */

.open-button {
    background: white;
    color: #111;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.open-button:hover {
    background: #ddd;
}

.open-button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* CARDS */

.cards {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(170px, 1fr)
        );

    gap: 20px;

    margin-top: 25px;
}

.card {
    background: #222;
    border-radius: 14px;
    padding: 10px;

    box-shadow: 0 5px 20px #000;

    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card-image {
    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    border-radius: 9px;

    background: #333;

    display: block;
}

.card-name {
    font-size: 18px;
    font-weight: bold;

    margin-top: 10px;
}

.card-number {
    color: #999;
    font-size: 13px;

    margin-top: 4px;
}

.count {
    color: #aaa;

    margin-top: 6px;
}

/* STATS */

.stats {
    display: flex;
    gap: 15px;

    flex-wrap: wrap;

    margin-bottom: 20px;
}

.stat {
    background: #222;

    padding: 15px 20px;

    border-radius: 12px;

    flex: 1;

    min-width: 150px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.stat-label {
    color: #999;
}

/* OTHER */

.message {
    color: #aaa;
    margin-top: 15px;
}

.empty {
    text-align: center;

    color: #777;

    padding: 50px;
}

.new-cards {
    margin-top: 35px;
}

/* MOBILE */

@media(max-width: 500px) {

    main {
        padding: 15px;
    }

    .pack {
        width: 180px;
        height: 250px;
    }

}
</style>

</head>

<body>

<header>

    <h1>funComunitty e-trading cards</h1>

    <nav>

        <button onclick="showScreen('home')">
            Pack
        </button>

        <button onclick="showScreen('collection')">
            Collection
        </button>

    </nav>

</header>


<main>

<!-- ========================= -->
<!-- PACK SCREEN -->
<!-- ========================= -->

<section
    id="home"
    class="screen active"
>

    <div class="pack-area">

        <h2>Daily Pack</h2>

        <p id="packStatus">
            Checking...
        </p>

        <div
            id="pack"
            class="pack"
            onclick="openPack()"
        >

            FUNCOMUNITTY<br>
            E-TRADING CARDS

        </div>

        <button
            id="openButton"
            class="open-button"
            onclick="openPack()"
        >
            Open Pack
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <div
        id="newCards"
        class="new-cards"
    ></div>

</section>


<!-- ========================= -->
<!-- COLLECTION SCREEN -->
<!-- ========================= -->

<section
    id="collection"
    class="screen"
>

    <h2>My Collection</h2>


    <div class="stats">

        <div class="stat">

            <div
                id="uniqueCount"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Unique Cards
            </div>

        </div>


        <div class="stat">

            <div
                id="totalCount"
                class="stat-number"
            >
                0
            </div>

            <div class="stat-label">
                Total Cards
            </div>

        </div>


        <div class="stat">

            <div
                id="completion"
                class="stat-number"
            >
                0%
            </div>

            <div class="stat-label">
                Completion
            </div>

        </div>

    </div>


    <div
        id="collectionCards"
        class="cards"
    ></div>

</section>

</main>


<script>

/*
==================================================
SETTINGS
==================================================
*/


const TOTAL_CARDS = 22;

const CARD_FOLDER = "cards/";


/*
==================================================
LOAD SAVED COLLECTION
==================================================
*/

let collection =
    JSON.parse(
        localStorage.getItem(
            "cardCollection"
        )
    ) || {};


let lastPack =
    localStorage.getItem(
        "lastPack"
    ) || "";


/*
==================================================
GET TODAY'S DATE
==================================================
*/

function getToday() {

    const date = new Date();

    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0")
    );

}


/*
==================================================
SAVE
==================================================
*/

function save() {

    localStorage.setItem(
        "cardCollection",
        JSON.stringify(collection)
    );

    localStorage.setItem(
        "lastPack",
        lastPack
    );

}


/*
==================================================
CREATE CARD
==================================================
*/

function getCard(number) {

    const id =
        String(number).padStart(
            2,
            "0"
        );

    return {

        id: id,

        name:
            "Card #" + id,

        image:
            CARD_FOLDER +
            id +
            ".png"

    };

}


/*
==================================================
RANDOM CARD
==================================================
*/

function randomCard() {

    const number =
        Math.floor(
            Math.random() *
            TOTAL_CARDS
        ) + 1;

    return getCard(number);

}


/*
==================================================
OPEN PACK
==================================================
*/

function openPack() {

    const today =
        getToday();


    /*
    Prevent multiple packs
    */

    if (lastPack === today) {

        return;

    }


    const button =
        document.getElementById(
            "openButton"
        );

    const pack =
        document.getElementById(
            "pack"
        );

    const message =
        document.getElementById(
            "message"
        );


    button.disabled = true;

    pack.classList.add(
        "pack-opening"
    );

    message.textContent =
        "Opening pack...";


    /*
    Small animation delay
    */

    setTimeout(() => {


        const pulledCards = [];


        /*
        Get exactly 5 cards
        */

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            const card =
                randomCard();


            pulledCards.push(
                card
            );


            /*
            Add to collection
            */

            if (
                !collection[
                    card.id
                ]
            ) {

                collection[
                    card.id
                ] = 0;

            }


            collection[
                card.id
            ]++;

        }


        /*
        Mark today's pack
        */

        lastPack =
            today;


        save();


        pack.classList.remove(
            "pack-opening"
        );


        message.textContent =
            "Pack opened! You got 5 cards!";


        displayNewCards(
            pulledCards
        );


        updatePackStatus();

        updateCollection();


    }, 1200);

}


/*
==================================================
DISPLAY NEW CARDS
==================================================
*/

function displayNewCards(
    pulledCards
) {

    const container =
        document.getElementById(
            "newCards"
        );


    container.innerHTML =
        "<h2>Your Cards</h2>";


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "cards";


    pulledCards.forEach(
        card => {

            grid.appendChild(
                createCardElement(
                    card
                )
            );

        }
    );


    container.appendChild(
        grid
    );

}


/*
==================================================
CREATE CARD HTML
==================================================
*/

function createCardElement(
    card
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "card";


    const count =
        collection[
            card.id
        ] || 0;


    div.innerHTML = `

        <img
            class="card-image"
            src="${card.image}"
            alt="${card.name}"
            onerror="
                this.alt='Missing card image';
            "
        >

        <div class="card-name">
            ${card.name}
        </div>

        <div class="card-number">
            #${card.id}
        </div>

        <div class="count">
            Owned: ${count}
        </div>

    `;


    return div;

}


/*
==================================================
UPDATE COLLECTION
==================================================
*/

function updateCollection() {

    const container =
        document.getElementById(
            "collectionCards"
        );


    container.innerHTML = "";


    let unique = 0;

    let total = 0;


    /*
    Go through all 22 cards
    */

    for (
        let i = 1;
        i <= TOTAL_CARDS;
        i++
    ) {

        const id =
            String(i).padStart(
                2,
                "0"
            );


        const count =
            collection[id] || 0;


        if (count > 0) {

            unique++;

            total += count;


            container.appendChild(
                createCardElement(
                    getCard(i)
                )
            );

        }

    }


    /*
    Update statistics
    */

    document.getElementById(
        "uniqueCount"
    ).textContent =
        unique;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    const percentage =
        Math.round(
            (
                unique /
                TOTAL_CARDS
            ) * 100
        );


    document.getElementById(
        "completion"
    ).textContent =
        percentage + "%";


    /*
    Empty collection
    */

    if (unique === 0) {

        container.innerHTML = `

            <div class="empty">

                You don't have any cards yet.<br><br>

                Open today's pack
                to start collecting!

            </div>

        `;

    }

}


/*
==================================================
CHECK DAILY PACK
==================================================
*/

function updatePackStatus() {

    const today =
        getToday();


    const button =
        document.getElementById(
            "openButton"
        );


    const pack =
        document.getElementById(
            "pack"
        );


    const status =
        document.getElementById(
            "packStatus"
        );


    if (
        lastPack === today
    ) {

        button.disabled =
            true;


        pack.classList.add(
            "disabled"
        );


        status.textContent =
            "You've already opened today's pack. Come back tomorrow!";


    } else {

        button.disabled =
            false;


        pack.classList.remove(
            "disabled"
        );


        status.textContent =
            "You have 1 pack available today!";

    }

}


/*
==================================================
SWITCH BETWEEN SCREENS
==================================================
*/

function showScreen(
    screen
) {

    document
        .querySelectorAll(
            ".screen"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "active"
                );

            }
        );


    document
        .getElementById(
            screen
        )
        .classList.add(
            "active"
        );


    if (
        screen ===
        "collection"
    ) {

        updateCollection();

    }

}


/*
==================================================
START PROGRAM
==================================================
*/

updatePackStatus();

updateCollection();

</script>

</body>
</html>
