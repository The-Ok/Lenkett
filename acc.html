<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenkett</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #302f2f);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .profile {
            margin-bottom: 30px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .profile p {
            opacity: 0.85;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.15);
            padding: 16px;
            border-radius: 12px;
            transition: 0.3s;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .link:hover {
            background: white;
            color: #4f46e5;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="profile">
        <h1>Welcome to Lenkett</h1>
    </div>

    <br>
    <br>

    <h2>If you're seeing this, please log in</h2>
    <br>
    <br>
        <a class="link" href="not.html">
            🌐 Notifications
        </a>

    </div>

</div>

<script>
  
    const acc = (localStorage.getItem("account"));
    window.location.href = "users/" + acc;
  
</script>

</body>
</html>
